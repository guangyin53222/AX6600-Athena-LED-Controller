# ============================================================
#  Athena LED feed 配置文件
#  用法：复制到 OpenWrt 源码根目录，命名为 feeds.conf
# ============================================================
#
# 写法说明：
#   ;v2.5.0  → 固定使用 v2.5.0 tag（推荐，稳定）
#   ;main    → 跟踪 main 分支最新提交（不推荐生产环境）
#
# 只需保留下面这一行即可，其余为示例参考。

src-git athena https://github.com/guangyin53222/AX6600-Athena-LED-Controller.git;v2.5.0

