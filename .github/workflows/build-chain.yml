name: Build Chain (Rust Binary + IPK + APK)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 🟢 第一阶段：编译 Rust 核心二进制
  build_rust:
    name: 1. Build Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 读取版本号 (从 athena-led/Makefile 读，这是 OpenWrt 打包用的 Makefile)
      - name: Get Version
        id: version
        run: |
          set -e
          MAKEFILE_PATH="athena-led/Makefile"
          if [ ! -f "$MAKEFILE_PATH" ]; then
            echo "⚠️ $MAKEFILE_PATH not found, using default version 1.0.0"
            PKG_VERSION="1.0.0"
          else
            PKG_VERSION=$(grep "PKG_VERSION:=" "$MAKEFILE_PATH" | cut -d"=" -f2 | tr -d '[:space:]')
            echo "✅ Found version $PKG_VERSION in $MAKEFILE_PATH"
          fi
          echo "VERSION=$PKG_VERSION" >> $GITHUB_OUTPUT

      # 2. 准备 Rust 环境
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      # 3. 安装 Zig (解决 ring 编译报错)
      - name: Install Zig & Zigbuild
        run: |
          set -e
          pip3 install cargo-zigbuild ziglang

      # 4. 编译 Rust
      #    注意：athena-led/ 下有 Makefile (OpenWrt打包) 和 Cargo.toml (Rust项目)
      #    如果存在 Cargo.toml 就直接编译，否则在 athena-led/ 下找
      - name: Compile Rust
        run: |
          set -e
          if [ -f "athena-led/Cargo.toml" ]; then
            cd athena-led
            cargo zigbuild --release --target aarch64-unknown-linux-musl
          else
            echo "❌ No Cargo.toml found in athena-led/"
            echo "--- athena-led/ contents ---"
            ls -la athena-led/
            exit 1
          fi

      # 5. 打包二进制 (Makefile 要求长文件名格式)
      - name: Package Binary
        id: package
        run: |
          set -e
          VERSION="${{ steps.version.outputs.VERSION }}"

          # Makefile 要求的文件名: athena-led-aarch64-unknown-linux-musl-v{VERSION}.tar.gz
          FILENAME="athena-led-aarch64-unknown-linux-musl-v${VERSION}.tar.gz"

          cd athena-led
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/athena-led dist/

          cd dist
          tar -czvf ../$FILENAME athena-led
          cd ..

          # 生成校验和
          sha256sum $FILENAME > $FILENAME.sha256
          cat $FILENAME.sha256

          echo "ASSET_NAME=$FILENAME" >> $GITHUB_OUTPUT
          echo "✅ Packed binary: $FILENAME"

      # 6. 上传 Rust 二进制 + 校验和 (仅 release 事件)
      - name: Upload Rust Binary to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            athena-led/*.tar.gz
            athena-led/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 7. 传递给 OpenWrt 任务
      - name: Pass Artifact to Next Job
        uses: actions/upload-artifact@v4
        with:
          name: rust-binary-tarball
          path: athena-led/*.tar.gz
          retention-days: 1

  # 🔵 第二阶段：编译 OpenWrt 安装包
  build_openwrt:
    name: 2. Build ${{ matrix.type }} (${{ matrix.name }})
    needs: build_rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: ipk
            name: Stable (23.05)
            sdk_url: "https://downloads.openwrt.org/releases/23.05.5/targets/ipq807x/generic"
            use_apk: false
          - type: apk
            name: SNAPSHOT (qualcommax)
            sdk_url: "https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq60xx"
            use_apk: true

    steps:
      - uses: actions/checkout@v4

      - name: Download Rust Artifact
        uses: actions/download-artifact@v4
        with:
          name: rust-binary-tarball
          path: local_dl/

      - name: Prepare SDK
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y zstd wget

          BASE_URL="${{ matrix.sdk_url }}"
          echo ">> Fetching SDK from $BASE_URL"

          # 重试下载 sha256sums
          for i in 1 2 3; do
            wget -q "$BASE_URL/sha256sums" -O sha256sums && break
            echo "⚠️ Failed to download sha256sums (attempt $i), retrying..."
            sleep 10
          done

          if [ ! -f "sha256sums" ] || [ ! -s "sha256sums" ]; then
            echo "❌ Cannot download sha256sums from $BASE_URL"
            exit 1
          fi

          SDK_FILE=$(grep "sdk" sha256sums | grep "Linux-x86_64" | head -n 1 | awk '{print $2}' | sed 's/*//g')
          if [ -z "$SDK_FILE" ]; then
            echo "❌ Cannot find SDK file in sha256sums"
            cat sha256sums
            exit 1
          fi
          echo ">> SDK file: $SDK_FILE"

          # 重试下载 SDK
          for i in 1 2 3; do
            wget -q "$BASE_URL/$SDK_FILE" -O "sdk_archive" && break
            echo "⚠️ Failed to download SDK (attempt $i), retrying..."
            sleep 15
          done

          if [ ! -f "sdk_archive" ] || [ ! -s "sdk_archive" ]; then
            echo "❌ Cannot download SDK archive"
            exit 1
          fi

          if [[ "$SDK_FILE" == *.zst ]]; then
            zstd -d "sdk_archive" -o sdk.tar
            tar -xf sdk.tar
          else
            tar -xf "sdk_archive"
          fi

          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "openwrt-sdk-*" | head -n 1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "❌ Cannot find extracted SDK directory"
            ls -la
            exit 1
          fi
          mv "$EXTRACTED_DIR" sdk
          echo ">> SDK ready in ./sdk"

      - name: Inject Source into SDK
        run: |
          set -e
          mkdir -p sdk/dl
          cp local_dl/*.tar.gz sdk/dl/
          echo ">> Injected tarballs into sdk/dl/:"
          ls -la sdk/dl/

      - name: Configure Feeds (with retry)
        working-directory: ./sdk
        run: |
          set -e
          # 全部改用 GitHub 镜像（避免 git.openwrt.org 不可达）
          sed -i 's|git.openwrt.org/openwrt/openwrt.git|github.com/openwrt/openwrt.git|g' feeds.conf.default
          sed -i 's|git.openwrt.org/feed/packages.git|github.com/openwrt/packages.git|g' feeds.conf.default
          sed -i 's|git.openwrt.org/project/luci.git|github.com/openwrt/luci.git|g' feeds.conf.default

          # feeds update 加重试
          for i in 1 2 3; do
            echo ">> feeds update attempt $i..."
            ./scripts/feeds update -a && break
            echo "⚠️ feeds update failed, retrying in 15s..."
            sleep 15
          done

          ./scripts/feeds install -a

      - name: Install Package Sources (athena-led + luci-app-athena-led)
        working-directory: ./sdk
        run: |
          set -e
          sudo apt-get install -y dos2unix

          # ============================================================
          # 1. athena-led 核心包（Rust 二进制 + init + config + 动画）
          # ============================================================
          mkdir -p package/athena-led
          cp "$GITHUB_WORKSPACE/athena-led/Makefile" package/athena-led/
          mkdir -p package/athena-led/files
          cp -r "$GITHUB_WORKSPACE/athena-led/files/." package/athena-led/files/
          echo "✅ athena-led package prepared"

          # ============================================================
          # 2. luci-app-athena-led Web 界面包（关键！之前漏掉的根因）
          # ============================================================
          mkdir -p package/luci-app-athena-led
          cp "$GITHUB_WORKSPACE/luci-app-athena-led/Makefile" package/luci-app-athena-led/

          # 复制 htdocs/ (JS 视图)
          if [ -d "$GITHUB_WORKSPACE/luci-app-athena-led/htdocs" ]; then
            mkdir -p package/luci-app-athena-led/htdocs
            cp -r "$GITHUB_WORKSPACE/luci-app-athena-led/htdocs/." package/luci-app-athena-led/htdocs/
            echo "✅ htdocs/ copied"
          fi

          # 复制 luasrc/ (Lua controller/CBI，向后兼容)
          if [ -d "$GITHUB_WORKSPACE/luci-app-athena-led/luasrc" ]; then
            mkdir -p package/luci-app-athena-led/luasrc
            cp -r "$GITHUB_WORKSPACE/luci-app-athena-led/luasrc/." package/luci-app-athena-led/luasrc/
            echo "✅ luasrc/ copied"
          fi

          # 复制 po/ (翻译文件)
          if [ -d "$GITHUB_WORKSPACE/luci-app-athena-led/po" ]; then
            mkdir -p package/luci-app-athena-led/po
            cp -r "$GITHUB_WORKSPACE/luci-app-athena-led/po/." package/luci-app-athena-led/po/
            echo "✅ po/ copied"
          fi

          # 复制 root/ (menu.d / acl.d / rpcd 权限)
          if [ -d "$GITHUB_WORKSPACE/luci-app-athena-led/root" ]; then
            mkdir -p package/luci-app-athena-led/root
            cp -r "$GITHUB_WORKSPACE/luci-app-athena-led/root/." package/luci-app-athena-led/root/
            echo "✅ root/ copied"
          fi

          echo "✅ luci-app-athena-led package fully prepared"
          echo "--- package/luci-app-athena-led/ tree ---"
          find package/luci-app-athena-led -type f | head -40

          # ============================================================
          # 3. 强制转为 Linux 换行符 (排除二进制动画文件)
          # ============================================================
          find package/athena-led package/luci-app-athena-led -type f \
            ! -name "*.bin" ! -name "*.lmo" -exec dos2unix {} + 2>/dev/null || true

      - name: Configure Build (.config)
        working-directory: ./sdk
        run: |
          set -e
          # 用 feeds install 注册包，然后生成默认 config
          ./scripts/feeds install -a 2>/dev/null || true

          # 创建 .config 并启用两个包
          cat > .config <<EOF
          CONFIG_PACKAGE_athena-led=y
          CONFIG_PACKAGE_luci-app-athena-led=y
          EOF

          # 让 SDK 自动补全依赖
          make defconfig

          echo "--- .config (athena entries) ---"
          grep -i athena .config || echo "(no athena entries found!)"

      - name: Compile athena-led
        working-directory: ./sdk
        run: |
          set -e
          echo ">> Downloading prebuilt binary tarball..."
          make package/athena-led/download V=s || true
          echo ">> Compiling athena-led..."
          make package/athena-led/compile V=s -j$(nproc)

      - name: Compile luci-app-athena-led
        working-directory: ./sdk
        run: |
          set -e
          echo ">> Compiling luci-app-athena-led..."
          make package/luci-app-athena-led/compile V=s -j$(nproc)

      # 确认产物
      - name: Verify Build Output
        run: |
          set -e
          echo "=== Searching for built packages ==="
          find sdk/bin -name "*athena-led*" -type f 2>/dev/null | tee found_packages.txt
          echo ""
          echo "--- Package count ---"
          wc -l found_packages.txt
          echo ""
          echo "--- Verify luci-app is included ---"
          if grep -q "luci-app-athena-led" found_packages.txt; then
            echo "✅ luci-app-athena-led was built successfully!"
          else
            echo "❌ luci-app-athena-led NOT FOUND in build output!"
            echo "--- Checking if it was even configured ---"
            grep "luci-app-athena-led" sdk/.config || echo "Not in .config either"
            exit 1
          fi

      # 生成校验和
      - name: Generate checksums
        run: |
          set -e
          cd sdk/bin
          : > sha256sums-${{ matrix.type }}.txt
          find . -name "*athena-led*.${{ matrix.type }}" | while read f; do
            sha256sum "$f" | sed 's# \./.*/# #'
          done | sort -u > sha256sums-${{ matrix.type }}.txt
          cat sha256sums-${{ matrix.type }}.txt

      # 上传产物到 workflow artifacts (调试用)
      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-packages-${{ matrix.type }}
          path: |
            sdk/bin/**/*athena-led*.${{ matrix.type }}
            sdk/bin/sha256sums-${{ matrix.type }}.txt
          retention-days: 7

      # 仅 release 事件上传到 Release
      - name: Upload Packages to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdk/bin/**/*athena-led*.${{ matrix.type }}
            sdk/bin/sha256sums-${{ matrix.type }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
