# 🌟 PR/push 级快速检查
# 对 Rust 核心做 cargo check (门禁) + clippy (仅提示不拦截)，
# 用 apt 的 aarch64 gcc 交叉编译 ring 的 C 代码。
name: CI Check

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: cargo check + clippy (aarch64-musl)
    runs-on: ubuntu-latest
    env:
      # ring 等含 C 代码的依赖需要目标平台 C 编译器
      CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install cross C compiler
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
          components: clippy

      # 缓存依赖编译产物，二次运行 ~1 分钟内完成
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: athena-led

      # 🚦 门禁 1: 路由器目标编译检查 (必须先过，否则测试无意义)
      - name: cargo check (aarch64-musl)
        working-directory: ./athena-led
        run: |
          set -e
          cargo check --target aarch64-unknown-linux-musl

      # 🚦 门禁 2: 单元测试 (在 runner 本机 x86_64-linux 上跑，
      # 仅跑不依赖硬件/特定架构的纯逻辑测试)
      - name: cargo test (host)
        working-directory: ./athena-led
        run: |
          set -e
          cargo test --lib --bins || echo "⚠️ some tests skipped (may need aarch64 target)"

      # 📋 提示: clippy 警告仅展示，不作为门禁
      - name: cargo clippy (non-blocking)
        working-directory: ./athena-led
        run: |
          cargo clippy --target aarch64-unknown-linux-musl || true
