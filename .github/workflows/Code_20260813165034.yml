name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2.5.0)'
        required: true
        default: 'v2.5.0'

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: stable

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            athena-led/src -> target

      # ✅ 关键修复：
      # 1) set -e 保证编译失败立刻退出
      # 2) 先确认 Cargo.toml 位置，再决定 cd 到哪里
      # 3) 编译后打印产物列表，确认文件存在
      - name: Build athena-led (aarch64-musl via Zig)
        run: |
          set -e
          echo "=== 仓库根目录结构 ==="
          ls -la
          echo "=== athena-led/ 内容 ==="
          ls -la athena-led/
          echo "=== athena-led/src/ 内容 ==="
          ls -la athena-led/src/ 2>/dev/null || echo "no src dir"

          # 自动定位 Cargo.toml
          if [ -f "athena-led/Cargo.toml" ]; then
            cd athena-led
          elif [ -f "athena-led/src/Cargo.toml" ]; then
            cd athena-led/src
          else
            echo "::error::Cargo.toml not found in expected locations"
            find . -name "Cargo.toml" -maxdepth 4
            exit 1
          fi

          echo "=== 使用 Cargo.toml 位于 ==="
          pwd
          cat Cargo.toml | head -20

          echo "=== 开始编译 ==="
          cargo zigbuild --release --target aarch64-unknown-linux-musl

          echo "=== 编译产物 ==="
          find target -name "athena-led" -type f 2>/dev/null

      # ✅ 自动定位二进制路径，不再硬编码
      - name: Strip binary
        run: |
          set -e
          # 自动找到刚编译出的二进制
          BIN="$(find athena-led -name "athena-led" -path "*/aarch64-unknown-linux-musl/*" -type f 2>/dev/null | head -1)"
          if [ -z "$BIN" ]; then
            echo "::error::athena-led binary not found after build!"
            find . -name "athena-led" -type f 2>/dev/null
            exit 1
          fi
          echo "Found binary: $BIN"
          file "$BIN"

          # 优先用 zig 自带的 llvm-strip
          ZIG_ROOT="$(dirname "$(which zig)")"
          STRIP=""
          for p in \
            "${ZIG_ROOT}/../lib/zig/llvm/bin/llvm-strip" \
            "${ZIG_ROOT}/llvm/bin/llvm-strip" \
            "$(which llvm-strip 2>/dev/null)" \
            "$(which aarch64-linux-musl-strip 2>/dev/null)" \
            "$(which strip 2>/dev/null)"; do
            if [ -x "$p" ]; then STRIP="$p"; break; fi
          done
          if [ -z "$STRIP" ]; then
            echo "::warning::No strip tool found, skipping strip"
          else
            echo "Using strip: $STRIP"
            "$STRIP" "$BIN"
          fi

      # ✅ 验证 + 打包，路径全部自动定位
      - name: Package binary tarball
        run: |
          set -e
          VERSION="${{ github.event.inputs.release_tag || github.ref_name }}"
          VERSION="${VERSION#v}"

          BIN="$(find athena-led -name "athena-led" -path "*/aarch64-unknown-linux-musl/*" -type f 2>/dev/null | head -1)"
          if [ -z "$BIN" ]; then
            echo "::error::athena-led binary not found!"
            exit 1
          fi
          echo "Packaging: $BIN"

          # tar 包内只有 "athena-led" 一个文件，无目录前缀
          tar czf "athena-led-aarch64-unknown-linux-musl-v${VERSION}.tar.gz" \
            -C "$(dirname "$BIN")" athena-led

          echo "=== tar.gz 内容验证（必须只有一行: athena-led）==="
          tar tzf "athena-led-aarch64-unknown-linux-musl-v${VERSION}.tar.gz"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: athena-led-binary
          path: athena-led-aarch64-unknown-linux-musl-v*.tar.gz

  build-ipk:
    needs: build-rust
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk:
          - { url: "https://downloads.openwrt.org/releases/23.05.5/targets/mediatek/filogic/openwrt-sdk-23.05.5-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz", name: "23.05" }
          - { url: "https://downloads.openwrt.org/releases/24.10.1/targets/mediatek/filogic/openwrt-sdk-24.10.1-mediatek-filogic_gcc-13.3.0_musl.Linux-x86_64.tar.xz", name: "24.10" }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rust binary
        uses: actions/download-artifact@v4
        with:
          name: athena-led-binary

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd dos2unix

      - name: Download & extract SDK
        run: |
          wget -q "${{ matrix.sdk.url }}" -O /tmp/sdk.tar.xz
          mkdir -p /opt/sdk
          tar xf /tmp/sdk.tar.xz -C /opt/sdk --strip-components=1
          [ -d /opt/sdk/bin ] || { echo "::error::SDK extract failed!"; exit 1; }

      - name: Setup packages
        run: |
          set -e
          VERSION="${{ github.event.inputs.release_tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          SDK=/opt/sdk

          echo "=== 验证 tar.gz 内容 ==="
          tar tzf athena-led-aarch64-unknown-linux-musl-v${VERSION}.tar.gz

          mkdir -p ${SDK}/package/athena-led
          cp athena-led/Makefile ${SDK}/package/athena-led/

          mkdir -p ${SDK}/package/luci-app-athena-led
          cp luci-app-athena-led/Makefile ${SDK}/package/luci-app-athena-led/

          # 解压到 SDK 包目录，tar 包内只有 athena-led 一个文件
          mkdir -p ${SDK}/package/athena-led/src/bin
          tar xzf athena-led-aarch64-unknown-linux-musl-v${VERSION}.tar.gz \
            -C ${SDK}/package/athena-led/src/bin/

          echo "=== SDK 包目录内容 ==="
          find ${SDK}/package/athena-led -type f

          if [ -d "athena-led/files" ]; then
            cp -r athena-led/files ${SDK}/package/athena-led/
          fi

      - name: Build packages
        run: |
          cd /opt/sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/athena-led/compile V=s
          make package/luci-app-athena-led/compile V=s

      - name: Collect ipk
        run: |
          mkdir -p /tmp/ipk-out
          find /opt/sdk/bin -name "*.ipk" -exec cp {} /tmp/ipk-out/ \;

      - name: Upload ipk
        uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.sdk.name }}
          path: /tmp/ipk-out/*.ipk

  build-apk:
    needs: build-rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Rust binary
        uses: actions/download-artifact@v4
        with:
          name: athena-led-binary

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd apk-tools

      - name: Download snapshot SDK
        run: |
          BASE="https://downloads.openwrt.org/snapshots/targets/mediatek/filogic/"
          SDK_NAME=$(curl -s "${BASE}" | grep -o 'openwrt-sdk[^"]*\.tar\.zst' | head -1)
          [ -z "$SDK_NAME" ] && { echo "::error::Failed to find snapshot SDK"; exit 1; }
          echo "Downloading: ${BASE}${SDK_NAME}"
          wget -q "${BASE}${SDK_NAME}" -O /tmp/sdk.tar.zst

      - name: Extract SDK
        run: |
          mkdir -p /opt/sdk
          tar --use-compress-program=unzstd -xf /tmp/sdk.tar.zst -C /opt/sdk --strip-components=1
          [ -d /opt/sdk/bin ] || { echo "::error::SDK extract failed!"; exit 1; }

      - name: Setup packages
        run: |
          set -e
          VERSION="${{ github.event.inputs.release_tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          SDK=/opt/sdk

          mkdir -p ${SDK}/package/athena-led/src/bin
          mkdir -p ${SDK}/package/luci-app-athena-led

          cp athena-led/Makefile ${SDK}/package/athena-led/
          cp luci-app-athena-led/Makefile ${SDK}/package/luci-app-athena-led/

          tar xzf athena-led-aarch64-unknown-linux-musl-v${VERSION}.tar.gz \
            -C ${SDK}/package/athena-led/src/bin/

          if [ -d "athena-led/files" ]; then
            cp -r athena-led/files ${SDK}/package/athena-led/
          fi

      - name: Build apk packages
        run: |
          cd /opt/sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig
          make package/athena-led/compile V=s
          make package/luci-app-athena-led/compile V=s

      - name: Collect apk
        run: |
          mkdir -p /tmp/apk-out
          find /opt/sdk/bin -name "*.apk" -exec cp {} /tmp/apk-out/ \;

      - name: Upload apk
        uses: actions/upload-artifact@v4
        with:
          name: apk-snapshot
          path: /tmp/apk-out/*.apk

  release:
    needs: [build-rust, build-ipk, build-apk]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/all-artifacts

      - name: Prepare release files
        run: |
          mkdir -p /tmp/release
          find /tmp/all-artifacts -type f \( -name "*.tar.gz" -o -name "*.ipk" -o -name "*.apk" \) -exec cp {} /tmp/release/ \;
          cd /tmp/release
          ls -la
          sha256sum * > sha256sums

      - name: Create/Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: /tmp/release/*
          overwrite: true
