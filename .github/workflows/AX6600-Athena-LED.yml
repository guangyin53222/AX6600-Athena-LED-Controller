name: Build athena-led (standalone)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt SDK version"
        required: false
        default: "SNAPSHOT"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: aarch64_cortex-a53
      TARGET: mediatek-filogic
      WORK_DIR: /home/runner/work/AX6600-Athena-LED-Controller/AX6600-Athena-LED-Controller

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull OpenWrt SDK (SNAPSHOT)
        run: |
          docker pull ghcr.io/openwrt/sdk:${{ env.ARCH }}-${{ inputs.version }}

      - name: Start SDK container
        run: |
          docker run -dit \
            --name sdk \
            -v ${{ env.WORK_DIR }}:/home/build/AX6600-Athena-LED-Controller \
            ghcr.io/openwrt/sdk:${{ env.ARCH }}-${{ inputs.version }} \
            /bin/bash

      - name: Configure feeds (GitHub + retry safe)
        run: |
          docker exec sdk bash -c '
            set -e
            cat > feeds.conf << EOF
src-git packages https://github.com/openwrt/packages.git;openwrt-24.10
src-git luci https://github.com/openwrt/luci.git;openwrt-24.10
src-git routing https://github.com/openwrt/routing.git;openwrt-24.10
src-git telephony https://github.com/openwrt/telephony.git;openwrt-24.10
EOF
          '

      - name: Update feeds (with retry)
        run: |
          docker exec sdk bash -c '
            set -e
            for i in 1 2 3; do
              echo "Attempt $i: updating feeds..."
              timeout 180 ./scripts/feeds update -a && break
              echo "Feeds update failed, retrying..."
              sleep 10
            done
          '

      - name: Install feeds
        run: |
          docker exec sdk bash -c '
            set -e
            ./scripts/feeds install -a
          '

      - name: Prepare package
        run: |
          docker exec sdk bash -c '
            set -e
            mkdir -p package/network/utils/athena-led
            cp -r /home/build/AX6600-Athena-LED-Controller/* package/network/utils/athena-led/
          '

      - name: Patch athena-led Makefile to 2.4.0
        run: |
          docker exec sdk bash -c '
            set -e
            sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=2.4.0/" package/network/utils/athena-led/Makefile
          '

      - name: Build package
        run: |
          docker exec sdk bash -c '
            set -e
            make defconfig
            make package/athena-led/compile V=s
          '

      - name: Safe ownership fix
        run: |
          sudo chown -R 1000:1000 "${{ env.WORK_DIR }}"

      - name: Upload ipk as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-led-2.4.0-SNAPSHOT
          path: |
            bin/packages/${{ env.ARCH }}/base/athena-led*.ipk
            bin/packages/${{ env.ARCH }}/*/athena-led*.ipk
          if-no-files-found: error
