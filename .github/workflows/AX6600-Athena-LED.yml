name: Build athena-led (standalone)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt SDK version"
        required: false
        default: "openwrt-25.12"
        type: string

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_TAG: mediatek-filogic-${{ inputs.version }}
      ARCH: aarch64_cortex-a53
      WORK_DIR: /home/runner/work/AX6600-Athena-LED-Controller/AX6600-Athena-LED-Controller

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Pull OpenWrt SDK (stable)
        run: |
          docker pull ghcr.io/openwrt/sdk:${{ env.ARCH }}-${{ inputs.version }}

      - name: Start SDK container
        run: |
          docker run -dit \
            --name sdk \
            -v ${{ env.WORK_DIR }}:/home/build/AX6600-Athena-LED-Controller \
            ghcr.io/openwrt/sdk:${{ env.ARCH }}-${{ inputs.version }} \
            /bin/bash

      - name: Configure feeds (TUNA mirror)
        run: |
          docker exec sdk bash -c "
            set -e
            cat > feeds.conf << 'EOF'
src-git packages https://mirrors.tuna.tsinghua.edu.cn/git/openwrt/feed/packages.git
src-git luci https://mirrors.tuna.tsinghua.edu.cn/git/openwrt/luci.git
src-git routing https://mirrors.tuna.tsinghua.edu.cn/git/openwrt/feed/routing.git
src-git telephony https://mirrors.tuna.tsinghua.edu.cn/git/openwrt/feed/telephony.git
EOF
          "

      - name: Update feeds
        run: |
          docker exec sdk bash -c "
            set -e
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          "

      - name: Prepare package
        run: |
          docker exec sdk bash -c "
            set -e
            mkdir -p package/network/utils/athena-led
            cp -r /home/build/AX6600-Athena-LED-Controller/* package/network/utils/athena-led/ || true
          "

      - name: Patch athena-led Makefile to 2.4.0
        run: |
          docker exec sdk bash -c "
            set -e
            sed -i 's/PKG_VERSION:=.*/PKG_VERSION:=2.4.0/' package/network/utils/athena-led/Makefile
          "

      - name: Build package
        run: |
          docker exec sdk bash -c "
            set -e
            make defconfig
            make package/athena-led/compile V=s
          "

      - name: Fix ownership (safe)
        run: |
          sudo chown -R 1000:1000 ${{ env.WORK_DIR }}

      - name: Upload ipk as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: athena-led-2.4.0-${{ inputs.version }}
          path: |
            bin/packages/${{ env.ARCH }}/base/athena-led*.ipk
            bin/packages/${{ env.ARCH }}/*/athena-led*.ipk
          if-no-files-found: error
