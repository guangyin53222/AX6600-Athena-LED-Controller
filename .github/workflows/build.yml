name: Build Chain (Binary + IPK + APK)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────
  # 阶段 1：编译 Rust 核心二进制
  # ─────────────────────────────────────────────
  build_rust:
    name: 1. Build Rust Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get Version
        id: version
        run: |
          MAKEFILE="athena-led/Makefile"
          if [ -f "$MAKEFILE" ]; then
            PKG_VERSION=$(grep "^PKG_VERSION:=" "$MAKEFILE" | cut -d= -f2 | tr -d '[:space:]')
          else
            PKG_VERSION="1.0.0"
          fi
          echo "VERSION=$PKG_VERSION" >> $GITHUB_OUTPUT

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Install Zig
        run: pip3 install cargo-zigbuild ziglang

      - name: Compile Rust
        working-directory: ./athena-led
        run: cargo zigbuild --release --target aarch64-unknown-linux-musl

      - name: Package Binary
        id: package
        working-directory: ./athena-led
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          FILENAME="athena-led-aarch64-unknown-linux-musl-v${VERSION}.tar.gz"
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/athena-led dist/
          cd dist
          tar -czvf ../$FILENAME athena-led
          cd ..
          sha256sum $FILENAME > $FILENAME.sha256
          cat $FILENAME.sha256
          echo "ASSET_NAME=$FILENAME" >> $GITHUB_OUTPUT

      - name: Upload Rust Binary to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            athena-led/*.tar.gz
            athena-led/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Pass Artifact to Next Job
        uses: actions/upload-artifact@v7
        with:
          name: rust-binary-tarball
          path: athena-led/*.tar.gz
          retention-days: 1

  # ─────────────────────────────────────────────
  # 阶段 2：编译 OpenWrt 安装包 (IPK + APK)
  # ─────────────────────────────────────────────
  build_openwrt:
    name: 2. Build ${{ matrix.type }}
    needs: build_rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - type: ipk
            sdk_url: "https://downloads.openwrt.org/releases/23.05.5/targets/ipq807x/generic"
          - type: apk
            sdk_url: "https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq60xx"

    steps:
      - uses: actions/checkout@v6

      - name: Download Rust Artifact
        uses: actions/download-artifact@v8
        with:
          name: rust-binary-tarball
          path: local_dl/

      - name: Prepare SDK
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          BASE_URL="${{ matrix.sdk_url }}"
          SDK_FILE=$(wget -qO- "$BASE_URL/sha256sums" | grep "sdk" | grep "Linux-x86_64" | head -n1 | awk '{print $2}' | sed 's/*//g')
          wget -q "$BASE_URL/$SDK_FILE"
          if [[ "$SDK_FILE" == *.zst ]]; then
            zstd -d "$SDK_FILE" -o sdk.tar && tar -xf sdk.tar
          else
            tar -xf "$SDK_FILE"
          fi
          mv "$(find . -maxdepth1 -type d -name 'openwrt-sdk-*' | head -n1)" sdk

      # 关键：把 tarball 放进 sdk/dl/，OpenWrt 会优先用本地文件，
      # 不会去访问 PKG_SOURCE_URL，也不会校验 PKG_HASH
      - name: Inject Binary into SDK dl/
        run: |
          mkdir -p sdk/dl
          cp local_dl/*.tar.gz sdk/dl/

      - name: Configure Feeds
        working-directory: ./sdk
        run: |
          sed -i 's|git.openwrt.org/openwrt/openwrt.git|github.com/openwrt/openwrt.git|g' feeds.conf.default
          sed -i 's|git.openwrt.org/feed/packages.git|github.com/openwrt/packages.git|g' feeds.conf.default
          sed -i 's|git.openwrt.org/project/luci.git|github.com/openwrt/luci.git|g' feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy Packages into SDK
        working-directory: ./sdk
        run: |
          # athena-led 核心包
          mkdir -p package/athena-led
          cp "$GITHUB_WORKSPACE/athena-led/Makefile" package/athena-led/
          cp -r "$GITHUB_WORKSPACE/athena-led/files"   package/athena-led/

          # luci-app-athena-led 界面包
          mkdir -p package/luci-app-athena-led
          cp -r "$GITHUB_WORKSPACE/luci-app-athena-led/"* package/luci-app-athena-led/

          # 统一换行符（排除二进制动画）
          sudo apt-get install -y dos2unix
          find package/athena-led package/luci-app-athena-led -type f ! -name "*.bin" -exec dos2unix {} +

      - name: Compile Packages
        working-directory: ./sdk
        run: |
          echo "CONFIG_PACKAGE_athena-led=m"         > .config
          echo "CONFIG_PACKAGE_luci-app-athena-led=m" >> .config
          make defconfig
          make package/athena-led/compile         V=s -j$(nproc)
          make package/luci-app-athena-led/compile V=s -j$(nproc)

      - name: Generate Checksums
        run: |
          cd sdk/bin
          find . -name "*athena-led*.${{ matrix.type }}" -exec sha256sum {} \; \
            | sed 's# \./.*/# #' > sha256sums-${{ matrix.type }}.txt
          cat sha256sums-${{ matrix.type }}.txt

      - name: Upload Packages to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sdk/bin/**/*athena-led*.${{ matrix.type }}
            sdk/bin/sha256sums-${{ matrix.type }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Packages as Artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: athena-led-${{ matrix.type }}-aarch64
          path: |
            sdk/bin/**/*athena-led*.${{ matrix.type }}
            sdk/bin/sha256sums-${{ matrix.type }}.txt
          retention-days: 7
